# Same gateway as litellm.yaml plus a vLLM-served model (used by
# docker-compose.gpu.yml). The Ollama models stay available, so the benchmark
# can compare the same model family on both engines.

model_list:
  - model_name: qwen2.5-7b-vllm
    litellm_params:
      model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
      api_base: http://vllm:8000/v1

  - model_name: llama3.1-8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434

  - model_name: qwen2.5-7b
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434

  - model_name: gemma3-4b
    litellm_params:
      model: ollama_chat/gemma3:4b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
