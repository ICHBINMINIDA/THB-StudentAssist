# LiteLLM gateway: one OpenAI-compatible API in front of every model.
# The app and the benchmark only know the model_name on the left; which engine
# serves it (Ollama here, vLLM in litellm.gpu.yaml) is decided in this file.
#
# Pull the models into Ollama first:
#   docker compose exec ollama ollama pull llama3.1:8b
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose exec ollama ollama pull gemma3:4b

model_list:
  - model_name: llama3.1-8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434

  - model_name: qwen2.5-7b
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434

  - model_name: gemma3-4b
    litellm_params:
      model: ollama_chat/gemma3:4b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true        # ignore OpenAI parameters a backend does not support
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
